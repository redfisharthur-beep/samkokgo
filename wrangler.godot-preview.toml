name = "samkokgo-godot-preview"
main = "worker.js"
compatibility_date = "2026-10-15"

[assets]
directory = "./godot/build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws", "/index.wasm"]

[[durable_objects.bindings]]
name = "GAME_HUB"
class_name = "GameHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameHub"]
