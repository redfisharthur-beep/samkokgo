name: Godot 4.3 project check

on:
  push:
    branches: [godot4-integration]
    paths:
      - "godot/**"
      - "worker.js"
      - "public/main.js"
      - ".github/workflows/godot-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Worker and browser JavaScript
        run: node --check worker.js && node --check public/main.js

      - name: Install Godot 4.3 headless
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          echo "GODOT=/tmp/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import and parse Godot project
        run: $GODOT --headless --editor --path godot --quit

      - name: Launch prototype in headless mode
        run: $GODOT --headless --path godot --quit-after 3

      - name: Install Godot 4.3 Web export templates
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            --output /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Export browser build
        run: |
          mkdir -p godot/build/web
          "$GODOT" --headless --path godot --export-release "Web" build/web/index.html

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: samkokgo-godot-web
          path: godot/build/web/
          if-no-files-found: error
          retention-days: 14
