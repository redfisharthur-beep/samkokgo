<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#d8d2c6" />
    <meta name="description" content="三國題材 2.5D 多人合作倖存者遊戲原型" />
    <title>三國倖存者</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/pixel-ui.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="world" aria-label="三國倖存者遊戲場景"></canvas>

      <section id="home" class="screen home-screen">
        <div class="kingdom-vista" aria-hidden="true"></div>
        <div class="home-glory" aria-hidden="true"><span>蜀</span><span>魏</span><span>吳</span></div>
        <div class="hero-stage" aria-hidden="true">
          <canvas width="56" height="72" data-portrait="caocao" class="stage-hero stage-cao"></canvas>
          <canvas width="56" height="72" data-portrait="liubei" class="stage-hero stage-liu"></canvas>
          <canvas width="56" height="72" data-portrait="sunquan" class="stage-hero stage-sun"></canvas>
          <canvas width="56" height="72" data-portrait="lvbu" class="stage-hero stage-lvbu"></canvas>
        </div>
        <div class="brand-title" role="heading" aria-level="1">
          <span class="brand-kicker">THE THREE KINGDOMS · PIXEL ADVENTURE</span>
          <strong>SamkokGo</strong>
          <b>三國倖存者</b>
          <span class="brand-ribbon">六人同征 · 亂世突圍</span>
        </div>
        <button class="hero-open" id="pickHero" type="button">選擇武將 <span id="currentHeroName">劉備</span><span aria-hidden="true">›</span></button>
        <div class="brand-mark" aria-hidden="true">
          <span class="brand-ring"></span><span class="brand-blade"></span><span class="brand-dot"></span>
        </div>

        <div class="home-actions">
          <button class="round-button primary-action" id="quickJoin" aria-label="快速加入" title="快速加入">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M27 4 11 26h11l-2 18 17-25H26l1-15Z"/></svg><span>快速加入</span>
          </button>
          <button class="round-button" id="createRoom" aria-label="建立公開房" title="建立公開房">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 42V9a3 3 0 0 1 3-3h23v36M8 42h32M34 17h8v25M17 15h9M17 22h9M17 29h9M17 36h6"/></svg><span>建立房間</span>
          </button>
          <button class="round-button" id="refreshRooms" aria-label="尋找房間" title="尋找房間">
            <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="21" cy="21" r="12"/><path d="m30 30 11 11M21 14v14M14 21h14"/></svg><span>公開房間</span>
          </button>
        </div>
        <div class="room-browser"><h3>軍情 · 公開房間</h3><div class="room-drawer" id="roomDrawer" aria-label="可加入的公開房間"></div></div>
        <div class="home-controls">
          <button class="small-icon-button" id="soundToggle" aria-label="開啟音效" title="音效"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12h6l7-6v20l-7-6H5zM23 12a6 6 0 0 1 0 8M25 8a11 11 0 0 1 0 16"/></svg></button>
          <button class="small-icon-button" id="fullscreen" aria-label="全螢幕" title="全螢幕">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 4H4v8M20 4h8v8M4 20v8h8M28 20v8h-8"/></svg>
          </button>
        </div>
        <div class="hero-picker hidden" id="heroPicker" role="dialog" aria-modal="true" aria-labelledby="heroPickerHeading">
            <div class="hero-picker-shell">
              <button type="button" id="closeHeroPicker" class="picker-close" aria-label="返回首頁">×</button>
              <p class="picker-label">SELECT YOUR GENERAL</p>
              <h2 id="heroPickerHeading">選擇出戰武將</h2>
              <div class="hero-choices" id="heroChoices"><button class="hero-choice" data-hero="liubei" aria-label="劉備" title="劉備" type="button"><canvas width="56" height="72" data-portrait="liubei" aria-hidden="true"></canvas><b>劉備</b><small>蜀 · 仁德之主</small></button>
<button class="hero-choice" data-hero="caocao" aria-label="曹操" title="曹操" type="button"><canvas width="56" height="72" data-portrait="caocao" aria-hidden="true"></canvas><b>曹操</b><small>魏 · 亂世梟雄</small></button>
<button class="hero-choice" data-hero="sunquan" aria-label="孫權" title="孫權" type="button"><canvas width="56" height="72" data-portrait="sunquan" aria-hidden="true"></canvas><b>孫權</b><small>吳 · 江東霸主</small></button>
<button class="hero-choice" data-hero="lvbu" aria-label="呂布" title="呂布" type="button"><canvas width="56" height="72" data-portrait="lvbu" aria-hidden="true"></canvas><b>呂布</b><small>群 · 無雙戰神</small></button></div>
              <div class="hero-description"><h3 id="heroInfoTitle">劉備 · 仁德之主</h3><p id="heroInfo">善於支援友軍，穩健迎戰四方敵軍。</p></div>
              <button id="confirmHero" type="button" class="picker-confirm">確認武將　◆</button>
            </div>
          </div>
      </section>

      <section id="room" class="screen room-screen hidden"><div class="kingdom-vista" aria-hidden="true"></div>
        <div class="room-banner"><p>ASSEMBLE YOUR TEAM</p><h1>英雄集結</h1><span id="roomCode">等待房間連線</span></div>
        <button class="small-icon-button back-button" id="leaveRoom" aria-label="離開房間" title="離開">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 6 10 16l10 10M11 16h17"/></svg>
        </button>
        <div class="room-status" id="roomStatus" aria-live="polite"></div>
        <div class="roster" id="roster"></div><p class="roster-caption">同袍集結中 · 最多六人合作</p>
        <div class="room-config" id="roomConfig" aria-label="房間設定">
          <button class="config-button" id="mapSelect" aria-label="切換地圖" title="地圖"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m4 10 10-5 12 5 10-5v25l-10 5-12-5-10 5V10ZM14 5v25m12-20v25M7 14h4M17 15l6 3M29 16l4-3"/></svg><span>地圖</span></button>
          <button class="config-button" id="difficultySelect" aria-label="切換難度" title="難度"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 36 34H4L20 4ZM20 15v9m0 5v1"/></svg><span>難度</span></button>
          <button class="config-button" id="sizeSelect" aria-label="切換人數上限" title="人數"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="14" cy="13" r="5"/><circle cx="27" cy="14" r="4"/><path d="M4 33c0-7 4-11 10-11s10 4 10 11M24 24c6-3 12 1 12 8"/></svg><span>人數</span></button>
        </div>
        <div class="room-actions">
          <button class="round-button" id="inviteButton" aria-label="複製邀請連結" title="邀請">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M19 29 29 19M16 32l-3 3a8 8 0 0 1-11-11l8-8a8 8 0 0 1 11 0M32 16l3-3a8 8 0 0 1 11 11l-8 8a8 8 0 0 1-11 0"/></svg>
          </button>
          <button class="round-button" id="lockRoom" aria-label="鎖定房間" title="鎖定房間">
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="21" width="32" height="23" rx="5"/><path d="M15 21v-7a9 9 0 0 1 18 0v7M24 29v7"/></svg>
          </button>
          <button class="round-button primary-action" id="startGame" aria-label="開始遊戲" title="開始遊戲">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5 28 18l13 5-13 4-4 16-5-16-12-4 12-5 5-13Z"/></svg>
          </button>
        </div>
      </section>

      <section id="gameHud" class="screen game-hud hidden">
        <button class="small-icon-button hud-back" id="exitGame" aria-label="離開遊戲" title="離開">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 6 10 16l10 10M11 16h17"/></svg>
        </button>
        <div class="game-topline">
          <div class="time-pill" aria-label="剩餘時間"><span class="hourglass">◷</span><span id="timer">12:00</span></div>
          <div class="party-strip" id="partyStrip"></div>
          <button class="small-icon-button camera-toggle" id="cameraToggle" aria-label="切換視角" title="切換視角">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="m4 12 12-7 12 7-12 7-12-7ZM4 20l12 7 12-7M9 15v7M23 15v7"/></svg>
          </button>
        </div>
        <button class="small-icon-button game-sound" id="soundToggleHud" aria-label="開啟音效" title="音效"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12h6l7-6v20l-7-6H5zM23 12a6 6 0 0 1 0 8M25 8a11 11 0 0 1 0 16"/></svg></button>
        <button class="small-icon-button game-lock" id="gameLock" aria-label="鎖定房間" title="鎖定房間"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="14" width="22" height="15" rx="3"/><path d="M10 14V9a6 6 0 0 1 12 0v5M16 19v5"/></svg></button>
        <div class="team-health" aria-label="角色生命"><span class="heart-mark" aria-hidden="true">♥</span><div class="health-track"><i id="healthFill"></i></div></div>
        <div class="level-track" aria-label="經驗值"><div id="xpFill"></div></div>
        <div class="boss-health hidden" id="bossHealth" aria-label="首領生命"><i id="bossHealthFill"></i></div>
        <div class="skill-row" id="skillRow" aria-label="技能"></div>
        <button class="special-button" id="specialAbility" aria-label="範圍絕技，能量未滿" title="範圍絕技">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M27 3 10 27h11l-2 18 19-27H26l1-15Z"/></svg>
        </button>
        <div class="level-choice hidden" id="levelChoice" aria-label="選擇強化"><div class="level-choice-cards" id="levelChoiceCards"></div></div>
        <div class="touch-stick" id="touchStick" aria-label="移動控制"><span class="stick-knob"></span></div>
        <div class="combat-flash" id="combatFlash"></div>
        <div class="revive-hint hidden" id="reviveHint" aria-label="等待隊友救援"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 25c6-8 11-8 15-3 4-5 9-5 15 3l-8 12H17L9 25ZM16 21l-5-8m21 8 5-8M20 34h8"/></svg></div>
      </section>

      <section id="result" class="screen result-screen hidden"><div class="kingdom-vista" aria-hidden="true"></div><div class="results-banner">SAMKOKGO · BATTLE REPORT</div>
        <div class="result-seal" id="resultSeal"></div>
        <div class="result-copy" aria-live="polite">
          <h1 id="resultHeading">戰鬥結束</h1>
          <p id="resultMessage">回到大廳，準備下一場征途。</p><p class="result-caption">英雄不息 · 征途未止</p>
        </div>
        <div class="result-actions">
          <button class="round-button primary-action" id="playAgain" aria-label="再玩一次" title="再玩一次">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M38 18A15 15 0 0 0 11 14l-3 4M10 9v9h9M10 30a15 15 0 0 0 27 4l3-4m-1 9v-9h-9"/></svg>
          </button>
          <button class="round-button" id="toHome" aria-label="回到大廳" title="回到大廳">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="m5 22 19-16 19 16M11 19v22h26V19M20 41V27h8v14"/></svg>
          </button>
        </div>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="rotateHint" class="rotate-hint hidden" aria-hidden="true"><span class="rotate-phone"></span></div>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
